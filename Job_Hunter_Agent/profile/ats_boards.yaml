# Cached ATS board tokens fetched every run. Curated by hand + extended by
# scripts/discover_boards.py. Every token here should return HTTP 200 from its platform's API --
# verify with:
#   curl -s -o /dev/null -w '%{http_code}\n' https://boards-api.greenhouse.io/v1/boards/<token>/jobs
#   curl -s -o /dev/null -w '%{http_code}\n' https://api.lever.co/v0/postings/<token>?mode=json
#
# Employer boards verified through their public career listings. Comeet, SmartRecruiters and
# Workday are discovery/manual-apply sources; unsupported forms are never auto-submitted.

greenhouse:
  # Verified 2026-10-15: each has active jobs with Israel-specific locations.
  - gongio
  - wizinc
  - riskified
  - forter
  - bluevineisrael
  - helloheart

lever: []

ashby: []
  # Ashby tokens could not be verified from this environment; validate manually or via
  # scripts/discover_boards.py before relying on them.

# Public employer-hosted Comeet listings include full responsibilities and requirements.
