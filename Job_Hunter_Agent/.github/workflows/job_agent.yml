name: Job Hunter Agent

on:
  schedule:
    # 06:00 and 12:00 UTC = 09:00 and 15:00 Israel time (UTC+3)
    - cron: "0 6,12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run read-only (no applications submitted)"
        type: boolean
        default: true
      max_apply:
        description: "Override the auto-apply cap (blank = default 5-7 random)"
        required: false
        default: ""

concurrency:
  group: job-hunter-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Restore resume from secret
        env:
          RESUME_PDF_BASE64: ${{ secrets.RESUME_PDF_BASE64 }}
        run: |
          mkdir -p assets
          if [ -n "$RESUME_PDF_BASE64" ]; then
            echo "$RESUME_PDF_BASE64" | base64 -d > assets/Adar_Rubin_CV.pdf
          else
            echo "::warning::RESUME_PDF_BASE64 secret not set -- every ATS form requires a resume upload, so auto-apply will bail on every job this run."
          fi

      - name: Run job hunter agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.max_apply }}" ]; then
            ARGS="$ARGS --max-apply ${{ inputs.max_apply }}"
          fi
          python -m job_agent.main $ARGS

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: job-agent-debug-${{ github.run_id }}
          path: |
            data/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state
        run: |
          git config user.name "job-hunter-agent[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/applied_jobs.json
          git diff --cached --quiet || git commit -m "chore: update applied jobs state [skip ci]"
          git push
